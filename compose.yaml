
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tasks_db
      DB_USER: app_user
      DB_PASSWORD: dev_password
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d tasks_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
